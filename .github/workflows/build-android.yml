name: Test & Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional API base URL override (defaults to repository variable API_BASE_URL)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  flutter-android:
    name: Flutter Tests & Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Install Dart & Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          EXTRA_ARGS="--build-number=${{ github.run_number }}"
          if [ -n "$API_BASE_URL" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dart-define=API_BASE_URL=$API_BASE_URL"
          fi
          flutter build apk --release $EXTRA_ARGS

      - name: Prepare APK artifact
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/RideSync-${SHORT_SHA}.apk"
          sha256sum "dist/RideSync-${SHORT_SHA}.apk" > "dist/RideSync-${SHORT_SHA}.apk.sha256"

      - name: Build Play Store AAB (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          EXTRA_ARGS="--build-number=${{ github.run_number }}"
          if [ -n "$API_BASE_URL" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dart-define=API_BASE_URL=$API_BASE_URL"
          fi
          flutter build appbundle --release $EXTRA_ARGS
          cp build/app/outputs/bundle/release/app-release.aab "dist/RideSync-${GITHUB_REF_NAME}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ridesync-android-${{ github.run_number }}
          path: dist/
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [backend-tests, flutter-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: ridesync-android-${{ github.run_number }}
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          cp "dist/RideSync-${SHORT_SHA}.apk" "dist/RideSync-${TAG}.apk"
          sha256sum "dist/RideSync-${TAG}.apk" > "dist/RideSync-${TAG}.apk.sha256"

          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          ASSETS=("dist/RideSync-${TAG}.apk" "dist/RideSync-${TAG}.apk.sha256")
          if [ -f "dist/RideSync-${TAG}.aab" ]; then
            ASSETS+=("dist/RideSync-${TAG}.aab")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "RideSync ${TAG}" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
