<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RideSync icon exporter</title>
<style>
  body { font-family: sans-serif; background: #111318; color: #E2E2E9; padding: 24px; }
  h1 { font-size: 1.3rem; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; }
  .card { background: #1D2024; border-radius: 12px; padding: 16px; width: 320px; }
  .preview { width: 288px; height: 288px; border-radius: 8px;
    background: repeating-conic-gradient(#33353A 0% 25%, #282A2F 0% 50%) 50% / 24px 24px; }
  .preview img { width: 100%; height: 100%; display: block; }
  button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 20px;
    background: #A8C7FA; color: #062E6F; font-weight: 600; cursor: pointer; }
  small { display: block; margin-top: 8px; color: #C4C6D0; }
</style>
</head>
<body>
<h1>RideSync icon exporter</h1>
<p>Click each button. The PNG files go to your Downloads folder.</p>
<div class="row">
  <div class="card">
    <div class="preview"><img id="img-full" alt="full icon"></div>
    <button onclick="save('full', 'app_icon.png')">Save app_icon.png</button>
    <small>Solid background. Used for iOS and as the main icon.</small>
  </div>
  <div class="card">
    <div class="preview"><img id="img-fg" alt="foreground icon"></div>
    <button onclick="save('fg', 'app_icon_foreground.png')">Save app_icon_foreground.png</button>
    <small>Transparent background. Used for the Android adaptive icon.</small>
  </div>
</div>
<script>
  const SVGS = {
    full: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\" width=\"1024\" height=\"1024\">\n<rect width=\"512\" height=\"512\" fill=\"#0F1D3D\"/>\n<g transform=\"translate(256 256) scale(1.08) translate(-255.6 -238.7)\">\n<g>\n  <g transform=\"translate(-22 -12)\">\n    <path d=\"M392 78 C366 78 346 98 346 122 C346 150 376 178 392 204\n             C408 178 438 150 438 122 C438 98 418 78 392 78 Z\" fill=\"#EFE9DD\"/>\n    <circle cx=\"392\" cy=\"122\" r=\"16\" fill=\"#0F1D3D\"/>\n  </g>\n  <path d=\"M104 402 C190 390 322 390 408 402\" fill=\"none\" stroke=\"#FF6B2B\"\n        stroke-width=\"20\" stroke-linecap=\"round\"/>\n  <g transform=\"translate(63 152) scale(1.75)\">\n    <circle cx=\"48\" cy=\"92\" r=\"28\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"15\"/>\n    <circle cx=\"172\" cy=\"92\" r=\"28\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"15\"/>\n    <circle cx=\"48\" cy=\"92\" r=\"9\" fill=\"#EFE9DD\"/>\n    <circle cx=\"172\" cy=\"92\" r=\"9\" fill=\"#EFE9DD\"/>\n    <path d=\"M172 92 L148 32\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"14\" stroke-linecap=\"round\"/>\n    <path d=\"M138 28 L164 21\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"11\" stroke-linecap=\"round\"/>\n    <circle cx=\"157\" cy=\"46\" r=\"10\" fill=\"#EFE9DD\"/>\n    <path d=\"M104 82 L48 92\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"13\" stroke-linecap=\"round\"/>\n    <path d=\"M50 50 C52 42 60 40 70 39 L98 38 L102 54 L58 62 C50 62 48 56 50 50 Z\" fill=\"#EFE9DD\"/>\n    <path d=\"M92 40 C102 10 142 10 154 32 L142 58 L96 60 Z\" fill=\"#EFE9DD\"/>\n    <path d=\"M100 52 L140 50 L134 94 L104 96 Z\" fill=\"#EFE9DD\"/>\n    <path d=\"M104 92 L78 104\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"15\" stroke-linecap=\"round\"/>\n  </g>\n</g>\n</g>\n</svg>",
    fg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\" width=\"1024\" height=\"1024\">\n<g transform=\"translate(256 256) scale(0.985) translate(-255.6 -238.7)\">\n<g>\n  <g transform=\"translate(-22 -12)\">\n    <path d=\"M392 78 C366 78 346 98 346 122 C346 150 376 178 392 204\n             C408 178 438 150 438 122 C438 98 418 78 392 78 Z\" fill=\"#EFE9DD\"/>\n    <circle cx=\"392\" cy=\"122\" r=\"16\" fill=\"#0F1D3D\"/>\n  </g>\n  <path d=\"M104 402 C190 390 322 390 408 402\" fill=\"none\" stroke=\"#FF6B2B\"\n        stroke-width=\"20\" stroke-linecap=\"round\"/>\n  <g transform=\"translate(63 152) scale(1.75)\">\n    <circle cx=\"48\" cy=\"92\" r=\"28\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"15\"/>\n    <circle cx=\"172\" cy=\"92\" r=\"28\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"15\"/>\n    <circle cx=\"48\" cy=\"92\" r=\"9\" fill=\"#EFE9DD\"/>\n    <circle cx=\"172\" cy=\"92\" r=\"9\" fill=\"#EFE9DD\"/>\n    <path d=\"M172 92 L148 32\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"14\" stroke-linecap=\"round\"/>\n    <path d=\"M138 28 L164 21\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"11\" stroke-linecap=\"round\"/>\n    <circle cx=\"157\" cy=\"46\" r=\"10\" fill=\"#EFE9DD\"/>\n    <path d=\"M104 82 L48 92\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"13\" stroke-linecap=\"round\"/>\n    <path d=\"M50 50 C52 42 60 40 70 39 L98 38 L102 54 L58 62 C50 62 48 56 50 50 Z\" fill=\"#EFE9DD\"/>\n    <path d=\"M92 40 C102 10 142 10 154 32 L142 58 L96 60 Z\" fill=\"#EFE9DD\"/>\n    <path d=\"M100 52 L140 50 L134 94 L104 96 Z\" fill=\"#EFE9DD\"/>\n    <path d=\"M104 92 L78 104\" fill=\"none\" stroke=\"#EFE9DD\" stroke-width=\"15\" stroke-linecap=\"round\"/>\n  </g>\n</g>\n</g>\n</svg>"
  };
  const SIZE = 1024;

  function dataUrl(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  document.getElementById('img-full').src = dataUrl(SVGS.full);
  document.getElementById('img-fg').src = dataUrl(SVGS.fg);

  // Draw the SVG onto a canvas at 1024 x 1024, then download the canvas as a PNG.
  function save(key, fileName) {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      canvas.getContext('2d').drawImage(img, 0, 0, SIZE, SIZE);
      canvas.toBlob((blob) => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        URL.revokeObjectURL(link.href);
      }, 'image/png');
    };
    img.src = dataUrl(SVGS[key]);
  }
</script>
</body>
</html>
